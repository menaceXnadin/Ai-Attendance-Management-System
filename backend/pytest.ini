[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
addopts = -ra --strict-markers --strict-config
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    integration: needs the PostgreSQL test database (attendancedb_test)
    migration: builds/upgrades a separate attendancedb_migtest database (slow, opt-in)
    slow: slow test
    committing: test commits data outside the per-test transaction (e.g. sync get_sync_db routes); DB is truncated + re-seeded afterwards
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:jose.*
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    ignore:datetime.datetime.utcnow:DeprecationWarning
